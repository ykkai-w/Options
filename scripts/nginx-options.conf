# /etc/nginx/sites-enabled/options.dmrml.cn
# 与主站 dmrml 完全独立的 vhost。SSL 证书由 certbot 单独申请。

server {
    listen 80;
    server_name options.dmrml.cn;
    # certbot HTTP-01 验证用,验证完后这块由 certbot 自动改为 redirect
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name options.dmrml.cn;

    # 这两行 certbot 申请完证书后会自动写入,先放占位的 self-signed,certbot 会覆盖
    ssl_certificate /etc/letsencrypt/live/options.dmrml.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/options.dmrml.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 安全 header
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/html;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;

    client_max_body_size 1m;

    # vendor 大文件长缓存
    location /static/vendor/ {
        alias /home/ubuntu/options-calc/static/vendor/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location /static/ {
        alias /home/ubuntu/options-calc/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
